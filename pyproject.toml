[project]
name = "rag-to-production"
version = "0.1.0"
description = "Taking a RAG system from demo to production: retrieval quality, evals, cost, observability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Roman Mkrtchian", email = "mkrtchia@gmail.com" }]
keywords = ["rag", "llm", "evaluation", "retrieval", "observability", "llm-as-a-judge"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["chromadb", "sentence-transformers", "google-genai", "httpx"]

[project.urls]
Homepage = "https://github.com/mkrtchian/rag-to-production"
Repository = "https://github.com/mkrtchian/rag-to-production"
Issues = "https://github.com/mkrtchian/rag-to-production/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_to_production"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
